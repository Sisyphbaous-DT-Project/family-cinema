plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigning = [
    storeFile: System.getenv('FAMILY_CINEMA_KEYSTORE'),
    storePassword: System.getenv('FAMILY_CINEMA_STORE_PASSWORD'),
    keyAlias: System.getenv('FAMILY_CINEMA_KEY_ALIAS'),
    keyPassword: System.getenv('FAMILY_CINEMA_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isBlank() }

android {
    namespace 'com.family.cinema'
    compileSdk 34

    defaultConfig {
        applicationId "com.family.cinema"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.11"
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            debuggable false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig = true }
}

// 正式构建必须提供发布签名，避免把未签名包误上传到 Release。
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
            && !hasReleaseSigning) {
        throw new GradleException('正式构建缺少签名，请使用 scripts/build-release.ps1 并提供外部签名配置。')
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    // 本地 HTTP server：把已缓存的视频以支持 Range 的方式喂给 <video>，否则无法拖动进度条
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
